apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentiment-api
  namespace: sentiment
spec:
  ingressClassName: nginx           # minikube addons enable ingress
  rules:
    - http:
        paths:
          - path: /api              # маршрутизация /api/* -> Service sentiment-api
            pathType: Prefix
            backend:
              service:
                name: sentiment-api
                port:
                  name: http
