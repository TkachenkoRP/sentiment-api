# Нагрузочный Job: 4 параллельных пода шлют запросы 5 минут -> CPU растёт -> HPA добавляет реплики.
# Запуск:  kubectl apply -f k8s/60-load-test.yaml     Остановка:  kubectl delete -f k8s/60-load-test.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: load-test
  namespace: sentiment
spec:
  parallelism: 4
  completions: 4
  activeDeadlineSeconds: 360
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              end=$(( $(date +%s) + 300 ))
              while [ $(date +%s) -lt $end ]; do
                wget -q -O /dev/null "http://sentiment-api:8080/api/sentiment?text=%D0%9E%D1%82%D0%BB%D0%B8%D1%87%D0%BD%D1%8B%D0%B9%20%D1%81%D0%B5%D1%80%D0%B2%D0%B8%D1%81%2C%20%D0%B2%D1%81%D0%B5%D0%BC%20%D1%80%D0%B5%D0%BA%D0%BE%D0%BC%D0%B5%D0%BD%D0%B4%D1%83%D1%8E%21%20%D0%9D%D0%BE%20%D0%B4%D0%BE%D1%81%D1%82%D0%B0%D0%B2%D0%BA%D0%B0%20%D0%B1%D1%8B%D0%BB%D0%B0%20%D1%83%D0%B6%D0%B0%D1%81%D0%BD%D0%BE%D0%B9"
              done
