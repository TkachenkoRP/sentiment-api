# Дашборд Grafana. Метка grafana_dashboard=1 -> sidecar Grafana автоматически подхватывает ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentiment-api-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  sentiment-api.json: |
    {
      "uid": "sentiment-api",
      "title": "Sentiment API (Spring Boot + ONNX)",
      "tags": [
        "sentiment",
        "spring-boot",
        "onnx"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Реплики (Deployment, доступно)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"sentiment\",deployment=\"sentiment-api\"}",
              "legendFormat": "",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 2,
          "title": "HPA: текущее / желаемое число реплик",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"sentiment\"}",
              "legendFormat": "current",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"sentiment\"}",
              "legendFormat": "desired",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "title": "Запросов в секунду (RPS)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 9,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"sentiment-api\",uri=\"/api/sentiment\"}[1m]))",
              "legendFormat": "",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area"
          }
        },
        {
          "id": 4,
          "title": "Средняя загрузка CPU от requests",
          "type": "gauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 14,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(rate(container_cpu_usage_seconds_total{namespace=\"sentiment\",container=\"sentiment-api\"}[1m])) / sum(kube_pod_container_resource_requests{namespace=\"sentiment\",container=\"sentiment-api\",resource=\"cpu\"})",
              "legendFormat": "",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 200,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 50
                  },
                  {
                    "color": "red",
                    "value": 100
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 5,
          "title": "Ответы 5xx (за сек.)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 19,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"sentiment-api\",status=~\"5..\"}[1m])) or vector(0)",
              "legendFormat": "",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 6,
          "title": "RPS по подам (балансировка нагрузки)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod)(rate(http_server_requests_seconds_count{application=\"sentiment-api\",uri=\"/api/sentiment\"}[1m]))",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 7,
          "title": "Задержка HTTP p95 / p50",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le)(rate(http_server_requests_seconds_bucket{application=\"sentiment-api\",uri=\"/api/sentiment\"}[1m])))",
              "legendFormat": "p95",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.50, sum by (le)(rate(http_server_requests_seconds_bucket{application=\"sentiment-api\",uri=\"/api/sentiment\"}[1m])))",
              "legendFormat": "p50",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 8,
          "title": "Время инференса ONNX-модели p95 / среднее",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le)(rate(sentiment_inference_seconds_bucket[1m])))",
              "legendFormat": "p95",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "sum(rate(sentiment_inference_seconds_sum[1m])) / sum(rate(sentiment_inference_seconds_count[1m]))",
              "legendFormat": "avg",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 9,
          "title": "Предсказания модели по классам",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (label)(rate(sentiment_requests_total[1m]))",
              "legendFormat": "{{label}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "stacking": {
                  "mode": "normal"
                },
                "fillOpacity": 30
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 10,
          "title": "CPU по подам (ядра)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod)(rate(container_cpu_usage_seconds_total{namespace=\"sentiment\",container=\"sentiment-api\"}[1m]))",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 11,
          "title": "JVM heap по подам",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod)(jvm_memory_used_bytes{application=\"sentiment-api\",area=\"heap\"})",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {}
        }
      ]
    }
